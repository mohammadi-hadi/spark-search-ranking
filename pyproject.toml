[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-search-ranking"
dynamic = ["version"]
description = "Counterfactual learning-to-rank for marketplace search logs in PySpark"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hadi Mohammadi" }]
keywords = [
    "pyspark",
    "learning-to-rank",
    "position-bias",
    "counterfactual",
    "inverse-propensity-scoring",
    "search-ranking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyspark[sql]>=3.5,<4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
spark-search-ranking = "spark_search_ranking.pipeline:main"

[project.urls]
Homepage = "https://github.com/mohammadi-hadi/spark-search-ranking"
Repository = "https://github.com/mohammadi-hadi/spark-search-ranking"
Issues = "https://github.com/mohammadi-hadi/spark-search-ranking/issues"
Releases = "https://github.com/mohammadi-hadi/spark-search-ranking/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "spark_search_ranking.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
