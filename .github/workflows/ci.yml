name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pyspark: "pyspark[sql]>=3.5,<3.6"
          - python: "3.12"
            pyspark: "pyspark[sql]>=4,<4.3"
          - python: "3.13"
            pyspark: "pyspark[sql]>=4,<4.3"
    name: test (py${{ matrix.python }}, ${{ matrix.pyspark }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "${{ matrix.pyspark }}"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

  demo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run pipeline
        run: spark-search-ranking --searches 60000 --users 5000 --items 8000 --cities 60
